# Ambiente local de desenvolvimento.
# Uso (a partir da raiz do repositório):
#   cp deploy/.env.example deploy/.env   # e troque as senhas
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: financas-familia

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      APP_DB_NAME: ${APP_DB_NAME:-financas}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?defina no .env}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?defina no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # Só no localhost, para desenvolvimento (go run / testes manuais).
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${APP_DB_NAME:-financas}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    entrypoint: ["/app/admin", "migrate", "up"]
    environment:
      MIGRATE_DATABASE_URL: postgres://app_owner:${APP_OWNER_PASSWORD}@db:5432/${APP_DB_NAME:-financas}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app_rw:${APP_RW_PASSWORD}@db:5432/${APP_DB_NAME:-financas}?sslmode=disable
      HTTP_ADDR: ":8080"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL: ${SESSION_TTL:-336h}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-72h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  db-data:
